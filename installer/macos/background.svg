<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!-- The .dmg window's backdrop. make-dmg.sh places sessionhub.app at
       (165, 185) and Applications at (495, 185), 128px icons; the arrow runs
       between them. Rendered to background.png / background@2x.png. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#eceff4"/>
    </linearGradient>
  </defs>
  <rect width="660" height="400" fill="url(#bg)"/>
  <path d="M258 182 H 402 M 390 170 L 403 182 L 390 194" fill="none" stroke="#6b788b"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="330" text-anchor="middle"
        font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" fill="#5f6f84">Drag sessionhub to Applications to install</text>
</svg>
