[package]
name = "sessionhubd"
version = "0.0.7"
edition = "2021"

[dependencies]
crossbeam-channel = "0.5.16"
getrandom = "0.4.3"
notify = "8.2.0"
portable-pty = "0.9.0"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tungstenite = "0.30.0"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
# The tray icon and the handles a detached child must not inherit:
# Shell_NotifyIcon, a hidden window, a popup menu, the clipboard.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
